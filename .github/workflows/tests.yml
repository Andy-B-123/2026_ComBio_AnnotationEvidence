name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System tools (htslib, samtools, bedtools)
        run: sudo apt-get update && sudo apt-get install -y tabix samtools bedtools
      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest tests -q
      - name: The example bundle validates
        run: python scripts/validate_bundle.py -q examples/minimal/bundle
