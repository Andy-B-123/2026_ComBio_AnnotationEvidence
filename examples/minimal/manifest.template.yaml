# Hand-written provenance for the minimal SYNTHETIC example. build.sh passes this to
# `make_manifest.py build`, which adds file sizes, checksums, record counts and the filters
# reported by the producer scripts. Where a program was NOT run, the entry says so.
spec_version: "0.1"

bundle:
  id: annotation-evidence-minimal-example
  title: Minimal synthetic annotation evidence bundle
  description: Two scaffolds, four genes. Genes A and B are annotated separately but one long-read model, one protein alignment and several RNA-seq junctions span both. All data are synthetic.
  license: CC0-1.0
  created_by:
    name: annotation-evidence contributors
  notes: Synthetic. Sequence, RNA-seq junction tables, long reads, predictions and coverage were generated by examples/minimal/make_synthetic.py. Only the protein alignments are genuine tool output (miniprot 0.18 run on the synthetic genome).

assembly:
  accession: none
  name: synthetic_genome_v1
  filename: genome.fa
  taxon:
    name: Synthetica exempli
    taxid: null
  notes: The FASTA is not part of the bundle. Sequence names and lengths are in assembly_sequences.tsv; 'lcl|' aliases show how a name mismatch is recorded.

annotation:
  filename: annotation.gff3.gz
  pipeline: hand-authored (synthetic)
  version: "1"
  date: "2026-09-25"
  source: examples/minimal/inputs/annotation.gff3
  notes: geneA is annotated 3-prime partial (no stop codon) and geneB 5-prime partial (no start codon). Annotated introns are listed by summarise_gene.py.

evidence:
  rna_short:
    present: true
    description: Short-read RNA-seq splice junctions collapsed across 8 synthetic libraries in 3 groups (head, gut, gonad).
    data_source:
      kind: synthetic
      accessions: []
      description: SJ.out.tab files written by make_synthetic.py in the STAR format; no reads were sequenced or mapped.
    programs:
      - name: STAR
        version: "2.7.11b"
        role: alignment
        parameters: "NOT RUN. Junction tables were generated directly in STAR SJ.out.tab format. In a real bundle record the full command line and the --outSJfilter* values here."
    guided_by_annotation: false
    summarisation: Junctions collapsed across samples by (seqid, strand, first and last intron base). A sample supports a junction if it has at least sample_min_unique_reads uniquely mapping reads on it.
    filters:
      upstream_star_filters: "not applicable (synthetic)"
    outputs:
      - file: evidence/rna_junctions.tsv.gz
        format: rna_junctions

  rna_long:
    present: true
    description: Long-read transcript models collapsed by intron chain from 3 synthetic Iso-Seq-like libraries.
    data_source:
      kind: synthetic
      accessions: []
      description: Per-read BED12 files written by make_synthetic.py; no reads were sequenced or aligned.
    programs:
      - name: minimap2
        version: "n/a"
        role: alignment
        parameters: "NOT RUN. In a real bundle record the preset (e.g. -x splice:hq) and the BAM filters."
      - name: bedtools
        version: "n/a"
        role: bam-to-bed12
        parameters: "NOT RUN. Real inputs: samtools view -F 0x900 -q 20 | bedtools bamtobed -bed12"
    summarisation: Alignments with the same seqid, strand and intron chain are one model; single-exon alignments are clustered by start and end; start and end are the median observed values.
    outputs:
      - file: evidence/long_read_models.bed.gz
        format: long_read_models

  proteins:
    present: true
    description: Four synthetic proteins aligned to the synthetic genome with miniprot.
    data_source:
      kind: synthetic
      accessions: []
      description: examples/minimal/inputs/proteins.faa, translated from the synthetic gene models with 8-12 % random substitutions.
    n_datasets: 4
    programs:
      - name: miniprot
        version: "0.18"
        role: alignment
        parameters: "miniprot --gff genome.fa proteins.faa (default parameters); genuinely run."
    databases:
      - name: synthetic proteins
        version: "1"
        taxon: synthetic
    summarisation: miniprot GFF3 retyped to protein_match / match_part; identity and coverage converted to percent; best-ranked alignment per protein kept.
    outputs:
      - file: evidence/protein_alignments.gff3.gz
        format: protein_alignments

  predictions:
    present: true
    description: Ab initio gene predictions from two tools. AUGUSTUS predicts A and B as one gene; Helixer predicts them separately.
    data_source:
      kind: synthetic
      accessions: []
      description: Records hand-authored in make_synthetic.py to look like predictor output.
    n_datasets: 2
    programs:
      - name: AUGUSTUS
        version: "3.5.0"
        role: prediction
        source_tag: AUGUSTUS
        model: synthetic_species
        parameters: "NOT RUN. Hand-authored records."
      - name: Helixer
        version: "0.3.4"
        role: prediction
        source_tag: Helixer
        model: invertebrate
        parameters: "NOT RUN. Hand-authored records."
    summarisation: Predictor output kept as GFF3 gene/mRNA/exon/CDS; column 6 carries the predictor's own confidence where available.
    outputs:
      - file: evidence/predictions.gff3.gz
        format: predictions

  coverage:
    present: true
    description: Merged (summed) RNA-seq depth over the 8 short-read libraries, quantised to a geometric ladder (about 19 % steps). Values are on the depth scale.
    data_source:
      kind: synthetic
      accessions: []
      description: examples/minimal/inputs/coverage.bedgraph, piecewise constant per exon/intron.
    n_datasets: 8
    programs:
      - name: bedGraphToBigWig
        version: "UCSC kent 20250326"
        role: conversion
        parameters: "genuinely run in build.sh"
    summarisation: "Summed over libraries, unique and multimapping alignments together (synthetic); depth snapped to the nearest 2^(k/4) - 1 (k integer); bigWig. Not strand-specific."
    filters:
      quantisation: "depth snapped to 2^(k/4) - 1, k integer (about 19 % steps); values are depth, not log depth"
      strand: both
    outputs:
      - file: evidence/coverage.bw
        format: coverage_bigwig

  repeats:
    present: true
    description: Three synthetic repeat intervals.
    data_source:
      kind: synthetic
      accessions: []
      description: examples/minimal/inputs/repeats.bed
    n_datasets: 1
    programs:
      - name: RepeatMasker
        version: "n/a"
        role: repeat-annotation
        parameters: "NOT RUN. Hand-authored records."
    summarisation: BED6, name = repeat class/family.
    outputs:
      - file: evidence/repeats.bed.gz
        format: repeats_bed6
