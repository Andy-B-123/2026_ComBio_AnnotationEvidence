# annotation-evidence manifest, spec 0.1. Provenance fields come from the template;
# file facts (bytes, sha256, records) and producer filters were computed by make_manifest.py.
spec_version: '0.1'
bundle:
  id: annotation-evidence-minimal-example
  title: Minimal synthetic annotation evidence bundle
  description: Two scaffolds, four genes. Genes A and B are annotated separately but one long-read model, one protein
    alignment and several RNA-seq junctions span both. All data are synthetic.
  license: CC0-1.0
  created_by:
    name: annotation-evidence contributors
  notes: Synthetic. Sequence, RNA-seq junction tables, long reads, predictions and coverage were generated by examples/minimal/make_synthetic.py.
    Only the protein alignments are genuine tool output (miniprot 0.18 run on the synthetic genome).
  created: '2026-09-25'
  generator: make_manifest.py 0.1.0
assembly:
  accession: none
  name: synthetic_genome_v1
  filename: genome.fa
  taxon:
    name: Synthetica exempli
    taxid: null
  notes: The FASTA is not part of the bundle. Sequence names and lengths are in assembly_sequences.tsv; 'lcl|' aliases
    show how a name mismatch is recorded.
  sequences_file: assembly_sequences.tsv
  n_sequences: 2
  total_length: 42000
  checksum:
    algorithm: sha256
    value: 39dd431f272974f825afc743f063903a3a43e0c7077cd0629ddc87d0c3ed8038
annotation:
  filename: annotation.gff3.gz
  pipeline: hand-authored (synthetic)
  version: '1'
  date: '2026-09-25'
  source: examples/minimal/inputs/annotation.gff3
  notes: geneA is annotated 3-prime partial (no stop codon) and geneB 5-prime partial (no start codon). Annotated
    introns are listed by summarise_gene.py.
  bytes: 498
  records: 34
  index: annotation.gff3.gz.tbi
  coordinates: 1-based-closed
  checksum:
    algorithm: sha256
    value: c863a678147dd939cfd7f8d9c6d79f3b3869b3f75feef1d5d67be9e057ac8551
evidence:
  rna_short:
    present: true
    description: Short-read RNA-seq splice junctions collapsed across 8 synthetic libraries in 3 groups (head, gut,
      gonad).
    data_source:
      kind: synthetic
      accessions: []
      description: SJ.out.tab files written by make_synthetic.py in the STAR format; no reads were sequenced or
        mapped.
    programs:
    - name: STAR
      version: 2.7.11b
      role: alignment
      parameters: NOT RUN. Junction tables were generated directly in STAR SJ.out.tab format. In a real bundle record
        the full command line and the --outSJfilter* values here.
    - name: aggregate_star_junctions.py
      version: 0.1.0
      role: summarisation
      parameters: '{"n_samples": 8, "source_format": "STAR SJ.out.tab", "strip_prefix": null, "upstream_star_filters":
        "not applicable (synthetic)"}'
    guided_by_annotation: false
    summarisation: Junctions collapsed across samples by (seqid, strand, first and last intron base). A sample supports
      a junction if it has at least sample_min_unique_reads uniquely mapping reads on it.
    filters:
      upstream_star_filters: not applicable (synthetic)
      min_sample_unique_reads: 1
      min_samples: 1
      min_total_unique_reads: 1
    outputs:
    - file: evidence/rna_junctions.tsv.gz
      format: rna_junctions
      bytes: 594
      sha256: d89f4b5de72555eab7e90588a7028724ecd34f84aec238f2a7bc4e2ceca62440
      records: 10
      index: evidence/rna_junctions.tsv.gz.tbi
      coordinates: 1-based-closed
    n_datasets: 8
    stats:
      aggregate_star_junctions.py:
        distinct_junctions_before_filters: 10
        dropped_by_min_samples_or_total: 0
        input_files: 8
        input_rows: 55
        motif_conflicts: 0
        output_rows: 10
        rows_below_sample_threshold: 0
        strand_motif_inconsistent: 0
  rna_long:
    present: true
    description: Long-read transcript models collapsed by intron chain from 3 synthetic Iso-Seq-like libraries.
    data_source:
      kind: synthetic
      accessions: []
      description: Per-read BED12 files written by make_synthetic.py; no reads were sequenced or aligned.
    programs:
    - name: minimap2
      version: n/a
      role: alignment
      parameters: NOT RUN. In a real bundle record the preset (e.g. -x splice:hq) and the BAM filters.
    - name: bedtools
      version: n/a
      role: bam-to-bed12
      parameters: 'NOT RUN. Real inputs: samtools view -F 0x900 -q 20 | bedtools bamtobed -bed12'
    - name: collapse_long_reads.py
      version: 0.1.0
      role: summarisation
      parameters: '{"boundaries": "median observed start/end", "collapse_key": "seqid+strand+intron_chain (single-exon:
        start/end clusters)", "n_samples": 3, "strip_prefix": null}'
    summarisation: Alignments with the same seqid, strand and intron chain are one model; single-exon alignments
      are clustered by start and end; start and end are the median observed values.
    outputs:
    - file: evidence/long_read_models.bed.gz
      format: long_read_models
      bytes: 339
      sha256: 2152f91e731716612a0d5ff0695b3b2a33ae01bf7bdc283e40eec1ead40a790e
      records: 10
      index: evidence/long_read_models.bed.gz.tbi
      coordinates: 0-based-half-open
    n_datasets: 3
    filters:
      min_intron_length: 30
      min_reads: 1
      min_samples: 1
      single_exon_alignments: clustered as single-exon models (start and end within 50 bp)
    stats:
      collapse_long_reads.py:
        input_alignments: 260
        input_files: 3
        models: 10
        output_models: 10
        single_exon_alignments: 32
        single_exon_models: 5
        single_exon_reads_in_models: 32
        spliced_models: 5
  proteins:
    present: true
    description: Four synthetic proteins aligned to the synthetic genome with miniprot.
    data_source:
      kind: synthetic
      accessions: []
      description: examples/minimal/inputs/proteins.faa, translated from the synthetic gene models with 8-12 % random
        substitutions.
    n_datasets: 4
    programs:
    - name: miniprot
      version: '0.18'
      role: alignment
      parameters: miniprot --gff genome.fa proteins.faa (default parameters); genuinely run.
    - name: miniprot_to_evidence.py
      version: 0.1.0
      role: summarisation
      parameters: '{"aligner": "miniprot 0.18", "db": "synthetic proteins", "source_format": "miniprot --gff", "taxid":
        null}'
    databases:
    - name: synthetic proteins
      version: '1'
      taxon: synthetic
    summarisation: miniprot GFF3 retyped to protein_match / match_part; identity and coverage converted to percent;
      best-ranked alignment per protein kept.
    outputs:
    - file: evidence/protein_alignments.gff3.gz
      format: protein_alignments
      bytes: 826
      sha256: de23cc7756efb9c57da065db50482ddb4c262b9b8b8f7851c378d577eaec3cf4
      records: 19
      index: evidence/protein_alignments.gff3.gz.tbi
      coordinates: 1-based-closed
    filters:
      max_rank: 1
      min_pct_coverage: 0.0
      min_pct_identity: 0.0
    stats:
      miniprot_to_evidence.py:
        alignments_in: 4
        dropped_coverage: 0
        dropped_identity: 0
        dropped_rank: 0
        kept: 4
        no_query_length: 0
  predictions:
    present: true
    description: Ab initio gene predictions from two tools. AUGUSTUS predicts A and B as one gene; Helixer predicts
      them separately.
    data_source:
      kind: synthetic
      accessions: []
      description: Records hand-authored in make_synthetic.py to look like predictor output.
    n_datasets: 2
    programs:
    - name: AUGUSTUS
      version: 3.5.0
      role: prediction
      source_tag: AUGUSTUS
      model: synthetic_species
      parameters: NOT RUN. Hand-authored records.
    - name: Helixer
      version: 0.3.4
      role: prediction
      source_tag: Helixer
      model: invertebrate
      parameters: NOT RUN. Hand-authored records.
    summarisation: Predictor output kept as GFF3 gene/mRNA/exon/CDS; column 6 carries the predictor's own confidence
      where available.
    outputs:
    - file: evidence/predictions.gff3.gz
      format: predictions
      bytes: 692
      sha256: a7ea3e58c905c2e7be0e88511215b5f7b16317eadf7228fd4ffeeb4c0111323c
      records: 54
      index: evidence/predictions.gff3.gz.tbi
      coordinates: 1-based-closed
  coverage:
    present: true
    description: Merged (summed) RNA-seq depth over the 8 short-read libraries, quantised to a geometric ladder
      (about 19 % steps). Values are on the depth scale.
    data_source:
      kind: synthetic
      accessions: []
      description: examples/minimal/inputs/coverage.bedgraph, piecewise constant per exon/intron.
    n_datasets: 8
    programs:
    - name: bedGraphToBigWig
      version: UCSC kent 20250326
      role: conversion
      parameters: genuinely run in build.sh
    summarisation: Summed over libraries, unique and multimapping alignments together (synthetic); depth snapped
      to the nearest 2^(k/4) - 1 (k integer); bigWig. Not strand-specific.
    filters:
      quantisation: depth snapped to 2^(k/4) - 1, k integer (about 19 % steps); values are depth, not log depth
      strand: both
    outputs:
    - file: evidence/coverage.bw
      format: coverage_bigwig
      bytes: 19424
      sha256: 4d0b197b25ecf8fc11405ea7008b73d99f1935bdc30da4ea650f050eb6cd5ca0
      coordinates: 0-based-half-open
  repeats:
    present: true
    description: Three synthetic repeat intervals.
    data_source:
      kind: synthetic
      accessions: []
      description: examples/minimal/inputs/repeats.bed
    n_datasets: 1
    programs:
    - name: RepeatMasker
      version: n/a
      role: repeat-annotation
      parameters: NOT RUN. Hand-authored records.
    summarisation: BED6, name = repeat class/family.
    outputs:
    - file: evidence/repeats.bed.gz
      format: repeats_bed6
      bytes: 141
      sha256: 84781af280176567a3d24bbdb9106bb4e422324ff686caf5eef2fb905ae1aa76
      records: 3
      index: evidence/repeats.bed.gz.tbi
      coordinates: 0-based-half-open
